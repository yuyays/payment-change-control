name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm --filter @pcc/domain test

      - name: Worker tests
        run: pnpm --filter @pcc/worker test

      - name: Durability (real workerd, alarm, restart)
        run: pnpm test:do

      - name: Web build
        run: pnpm --filter @pcc/web build
